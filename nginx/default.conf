## dgongut-web — versión endurecida (2026-11-09)

# Caché del proxy de Docker Hub (contexto http: este archivo se incluye dentro de http {})
proxy_cache_path /tmp/dockerhub-cache levels=1 keys_zone=dockerhub:1m max_size=5m inactive=24h use_temp_path=off;
# Y del resumen de telemetry (instalaciones activas de los bots)
proxy_cache_path /tmp/telemetry-cache levels=1 keys_zone=telemetry:1m max_size=1m inactive=24h use_temp_path=off;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;

    server_name _;
    server_tokens off;

    include /config/nginx/ssl.conf;

    root /config/www;
    index index.html;

    include /config/nginx/security-headers.conf;

    # Proxy de Docker Hub (no permite CORS). URL fija: no es un proxy abierto.
    # Se guarda 10 min: aunque alguien recargue en bucle, Docker Hub recibe como mucho 6 peticiones/hora.
    location = /api/dockerhub.json {
        limit_except GET { deny all; }
        proxy_pass https://hub.docker.com/v2/repositories/dgongut/?page_size=100;
        proxy_set_header Host hub.docker.com;
        proxy_set_header Cookie "";
        proxy_ssl_server_name on;
        proxy_hide_header Set-Cookie;
        proxy_ignore_headers Cache-Control Expires Set-Cookie Vary;
        proxy_cache dockerhub;
        proxy_cache_key dockerhub;
        proxy_cache_valid 200 10m;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_429 http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        include /config/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=600" always;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # Instalaciones activas de los bots (telemetry no permite CORS). URL fija y 10 min de caché, como Docker Hub.
    location = /api/telemetry.json {
        limit_except GET { deny all; }
        proxy_pass https://telemetry.dgongut.com/v1/projects;
        proxy_set_header Host telemetry.dgongut.com;
        proxy_set_header Cookie "";
        proxy_ssl_server_name on;
        proxy_hide_header Set-Cookie;
        proxy_ignore_headers Cache-Control Expires Set-Cookie Vary;
        proxy_cache telemetry;
        proxy_cache_key telemetry;
        proxy_cache_valid 200 10m;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_429 http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        include /config/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=600" always;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # Lista de donantes: se lee del contenedor dgongut-donate-web (misma red de Docker),
    # así sigue habiendo un único donors.json que mantienen los bots.
    location = /api/donors.json {
        limit_except GET { deny all; }
        resolver 127.0.0.11 valid=30s;
        set $donate http://dgongut-donate-web:80;
        proxy_pass $donate/donors.json;
        proxy_set_header Cookie "";
        proxy_hide_header Set-Cookie;
        include /config/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=300" always;
    }

    # El script cambia cuando editas la web: que navegadores y Cloudflare siempre comprueben si hay versión nueva
    location = /app.js {
        include /config/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    location /fonts/ {
        include /config/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Rutas inexistentes: 404 de verdad (para Google), pero mostrando la terminal con "No such file or directory"
    error_page 404 /index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Sin PHP en esta web
    location ~ \.php$ { return 404; }
    location ~ /\. { deny all; }
}
