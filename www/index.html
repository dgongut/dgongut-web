  :root {
    --fg: #d4d4d8;
    --muted: #71717a;
    --prompt: #f5a524;
    --cmd: #4ade80;
    --link: #7dd3fc;
    --accent1: #c4b5fd;
    --accent2: #7dd3fc;
    --cursor: #4ade80;
    --star: #e8c872;
    --warn: #fca5a5;
    --bg1: #1c211d; --bg2: #121513; --bg3: #070807;
    --tint: rgba(120,255,160,.045);
  }
  /* temas de fósforo monocromo (comando: theme amber | theme green | theme default) */
  body[data-theme="amber"] {
    --fg: #ffc35c; --muted: #a8732a; --prompt: #ffd98a; --cmd: #ffb000; --link: #ffcf66;
    --accent1: #ffb000; --accent2: #ffd98a; --cursor: #ffb000; --star: #ffe3a6; --warn: #ff7a3d;
    --bg1: #231a0b; --bg2: #151007; --bg3: #080502; --tint: rgba(255,180,60,.05);
  }
  body[data-theme="green"] {
    --fg: #7dff98; --muted: #2f9a4c; --prompt: #b2ffc0; --cmd: #39ff6a; --link: #9dffb0;
    --accent1: #39ff6a; --accent2: #b2ffc0; --cursor: #39ff6a; --star: #d0ffd9; --warn: #c6ff4d;
    --bg1: #0f2213; --bg2: #09150c; --bg3: #030804; --tint: rgba(80,255,120,.05);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { background: #050605; }
  body {
    font-family: "JetBrains Mono", ui-monospace, Menlo, monospace;
    font-size: 15px; line-height: 1.6;
    min-height: 100vh; display: flex; flex-direction: column;
    color: var(--fg);
    /* pantalla de fósforo: centro algo más claro que los bordes */
    background: radial-gradient(ellipse at center, var(--bg1) 0%, var(--bg2) 55%, var(--bg3) 100%) fixed;
    transition: background .4s;
      }
  /* líneas de barrido */
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 10;
    background:
      repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0, rgba(0,0,0,0) 2px, rgba(0,0,0,.28) 3px, rgba(0,0,0,0) 4px),
      repeating-linear-gradient(90deg, rgba(255,0,0,.025), rgba(0,255,0,.015) 1px, rgba(0,0,255,.025) 2px, transparent 3px);
    animation: flicker 6s infinite steps(1);
  }
  /* viñeta + cristal curvo + barra de refresco */
  body::after {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 11;
    background:
      linear-gradient(to bottom, transparent 0%, var(--tint) 50%, transparent 100%) 0 -30vh / 100% 30vh no-repeat,
      radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,.65) 100%);
    box-shadow: inset 0 0 120px rgba(0,0,0,.85), inset 0 0 18px rgba(120,255,160,.08);
    border-radius: 18px;
    animation: roll 7s linear infinite;
  }
  @keyframes roll { to { background-position: 0 130vh, 0 0; } }
  @keyframes flicker { 0%,100% { opacity: 1; } 47% { opacity: .85; } 48% { opacity: 1; } 83% { opacity: .92; } }
  @keyframes turnon {
    0% { transform: scale(1, .004); filter: brightness(4); opacity: 0; }
    35% { transform: scale(1, .004); filter: brightness(4); opacity: 1; }
    60% { transform: scale(1, 1); filter: brightness(1.6); }
    100% { transform: scale(1, 1); filter: brightness(1); }
  }
  @keyframes turnoff {
    0% { transform: scale(1, 1); filter: brightness(1); opacity: 1; }
    55% { transform: scale(1, .004); filter: brightness(4); opacity: 1; }
    80% { transform: scale(.02, .004); filter: brightness(6); opacity: 1; }
    100% { transform: scale(0, 0); opacity: 0; }
  }

  /* glow de fósforo: cada letra brilla con su propio color */
  body { text-shadow: 0 0 1px rgba(255,255,255,.4), 0 0 6px rgba(212,212,216,.5), 0 0 16px rgba(212,212,216,.22); }
  @supports (color: color-mix(in srgb, red 50%, transparent)) {
    body * {
      text-shadow:
        0 0 1px color-mix(in srgb, currentColor 90%, white),
        0 0 5px color-mix(in srgb, currentColor 75%, transparent),
        0 0 14px color-mix(in srgb, currentColor 40%, transparent),
        0 0 28px color-mix(in srgb, currentColor 15%, transparent);
    }
  }
  main, footer { animation: turnon .7s ease-out both; }
  body.off main, body.off footer { animation: turnoff .55s ease-in forwards; }

  main { flex: 1; width: 100%; max-width: 860px; margin: 0 auto; padding: 8vh 16px 32px; }

    margin-bottom: 1.6rem; overflow: hidden; text-shadow: none;

  a { color: var(--link); text-decoration: none; border-bottom: 1px dashed currentColor; }

  .item { display: flex; flex-wrap: wrap; column-gap: .6em; padding-left: 1.2em; }

  /* nombre de proyecto pulsable (muestra su descripción) */

  /* comandos pulsables */

  .cursor { display: inline-block; width: .6em; height: 1.1em; background: var(--cursor); vertical-align: text-bottom; animation: blink 1s step-end infinite; box-shadow: 0 0 8px color-mix(in srgb, var(--cursor) 80%, transparent); }
  @keyframes blink { 50% { opacity: 0; } }
  #input-line { display: none; align-items: baseline; }
  #input-line.on { display: flex; }
  #input {
    flex: 1; background: transparent; border: 0; outline: 0; color: var(--cmd);

  .hint { color: var(--muted); font-size: .85em; margin-top: 1.2rem; display: flex; flex-wrap: wrap; align-items: center; gap: .35em .5em; }
  .hint .chips { display: none; flex-wrap: wrap; gap: .4em; }
  body.booted .hint .chips { display: inline-flex; }
  .hint .chip {
    font: inherit; color: var(--cmd); cursor: pointer;
    background: color-mix(in srgb, var(--cmd) 6%, transparent); border: 1px solid color-mix(in srgb, var(--cmd) 35%, transparent); border-radius: 4px;
    padding: .1em .55em; box-shadow: 0 0 6px color-mix(in srgb, var(--cmd) 15%, transparent);
  }
  .hint .chip:hover, .hint .chip:focus-visible { background: color-mix(in srgb, var(--cmd) 15%, transparent); outline: none; }
  .hint .snd { font: inherit; background: none; border: 0; cursor: pointer; color: var(--muted); }
  .hint .snd:hover { color: var(--cmd); }
  .hint .swap { font: inherit; color: var(--link); background: none; border: 0; border-bottom: 1px dashed currentColor; cursor: pointer; }
  footer { text-align: center; color: var(--cmd); font-size: .8rem; padding: 24px 16px; }
  noscript .out { display: block; }
  .donor { color: var(--star); white-space: nowrap; }

  /* capas de easter eggs (por debajo de las líneas de barrido) */
  .fx { position: fixed; inset: 0; z-index: 5; }
  canvas.fx { background: #050805; }
  .fx.panic {
    background: #000; color: #e5e5e5; padding: 6vh 6vw; white-space: pre-wrap; font-size: .9em;
    text-shadow: 0 0 4px rgba(255,255,255,.4); overflow: hidden;
  }
  .fx.panic .warn { display: block; margin-bottom: 1em; }
  .fx.dark {
    background: #030403; display: flex; align-items: center; justify-content: center;
    color: #3f4a43; cursor: pointer; text-shadow: none; font-size: .85em; text-align: center; padding: 16px;
  }
  .fx.dark span { animation: blink 2s step-end infinite; }

  /* degauss: el "boing" de desmagnetizar un monitor CRT */
  @keyframes degauss {
    0% { transform: none; filter: none; }
    12% { transform: skewX(5deg) scale(1.03); filter: hue-rotate(120deg) blur(1px); }
    28% { transform: skewX(-4deg) scale(.98); filter: hue-rotate(-90deg); }
    45% { transform: skewX(3deg); filter: hue-rotate(60deg); }
    62% { transform: skewX(-2deg); filter: hue-rotate(-30deg); }
    80% { transform: skewX(1deg); filter: hue-rotate(10deg); }
    100% { transform: none; filter: none; }
  }
  body.degauss main > * { animation: degauss 1.1s ease-out; }

  @media (max-width: 600px) { body { font-size: 13px; } main { padding-top: 5vh; } }
  @media (prefers-reduced-motion: reduce) { .cursor, body::before, body::after, main, footer, .fx.dark span, body.degauss main > * { animation: none; } body.off main, body.off footer { animation: none; opacity: 0; } }
